# Vault secret/platform/servicenow → Secret/servicenow-mcp.
# Keys in Vault: host, username, password.
# Never commit the secret values. Host name only may appear in docs:
# https://dev203166.service-now.com
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: servicenow-mcp
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: servicenow-mcp
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SERVICENOW_HOST
      remoteRef:
        key: platform/servicenow
        property: host
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: SERVICENOW_USERNAME
      remoteRef:
        key: platform/servicenow
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: SERVICENOW_PASSWORD
      remoteRef:
        key: platform/servicenow
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
