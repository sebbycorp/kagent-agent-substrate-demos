# SandboxAgent shape matches kagent-crds 0.10.0-rc2 (kagent.dev/v1alpha2, runtime go).
# Do not bump substrate past 0.0.9. Do not flatten valueFrom on the generated ActorTemplate.
#
# Omit snapshotsConfig (same as hello-substrate / fortigate on Viper).
# kagent then writes ActorTemplate location gs://ate-snapshots/kagent/aws-budget.
# Today atelet 0.0.9 is ATE_STORAGE_BACKEND=s3 → rustfs.ate-system.svc:9000,
# rustfs bucket ate-snapshots (1Gi PVC). The gs:// scheme is a prefix only;
# objects live on rustfs, not Google Cloud. Do not set
# gs://viper-kagent-ate-snapshots here — that rustfs bucket does not exist
# and golden snapshot would fail. GCS is reserved for a later cluster-wide
# atelet cutover (see docs/snapshots-gcs.md).
#
# Skills: 0.10.0-rc2 SandboxAgentSpec CEL rejects spec.skills
# ("spec.skills is not supported for sandbox agents"). There is no volume
# mount into the gVisor actor. Live Viper pattern (fortigate, hello-substrate)
# is declarative.systemMessage. We compose that message from ConfigMap
# aws-budget-skills via declarative.promptTemplate (published rc2 field).
# Do not set spec.skills. Do not invent ActorTemplate volume mounts.
apiVersion: kagent.dev/v1alpha2
kind: SandboxAgent
metadata:
  name: aws-budget
  namespace: kagent
spec:
  type: Declarative
  description: Executive AWS budget and capacity assistant for us-east-2 (gVisor)
  declarative:
    runtime: go
    modelConfig: default-model-config
    promptTemplate:
      dataSources:
        - kind: ConfigMap
          name: aws-budget-skills
          alias: skills
    systemMessage: |
      You help the executive team manage AWS budget and capacity in us-east-2 only.

      You run as a Go ADK declarative SandboxAgent on Agent Substrate
      (gVisor actor, WorkerPool kagent-default). Your tools are aws_* MCP
      wrappers. Prefer read-only tools. There should be almost no writes;
      ask before any write. This server has no terminate, IAM-create, or
      budget-delete tools.

      Follow the skills inlined below (budget, capacity, executive-brief).
      They are loaded from ConfigMap aws-budget-skills into this system
      message. You do not have a /skills directory or repo checkout.

      Never invent spend, instance counts, quota numbers, or budget status.
      If a tool fails or returns empty, say so. Never print secrets, access
      keys, or Vault tokens.

      Cost Explorer and Budgets use the us-east-1 API endpoint; still
      report us-east-2 filtered spend. Do not answer for other regions.

      For exec questions, prefer aws_executive_brief, then expand with
      budget/capacity tools if asked.

      ---
      {{include "skills/budget.md"}}

      ---
      {{include "skills/capacity.md"}}

      ---
      {{include "skills/executive-brief.md"}}
    tools:
      - type: McpServer
        mcpServer:
          name: aws-budget-mcp
          kind: RemoteMCPServer
          apiGroup: kagent.dev
          toolNames:
            - aws_whoami
            - aws_cost_month
            - aws_cost_by_service
            - aws_budgets
            - aws_ec2_capacity
            - aws_asg
            - aws_rds
            - aws_ebs_summary
            - aws_service_quotas
            - aws_rightsizing_hints
            - aws_executive_brief
  substrate:
    workerPoolRef:
      name: kagent-default
