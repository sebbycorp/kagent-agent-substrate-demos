# AWS budget MCP tools Deployment + Service.
# Image: aws-budget-mcp:dev (local tag for `ctr images import` on the k3s node).
# Intended published name: ghcr.io/sebbycorp/aws-budget-mcp:dev
# imagePullPolicy: IfNotPresent — the pod cannot start until the image is
# imported on Viper. See images/aws-budget-mcp/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-budget-mcp
  namespace: kagent
  labels:
    app.kubernetes.io/name: aws-budget-mcp
    app.kubernetes.io/part-of: aws-sandbox-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aws-budget-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aws-budget-mcp
        app.kubernetes.io/part-of: aws-sandbox-agent
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: aws-budget-mcp
          image: aws-budget-mcp:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: mcp
              containerPort: 8084
              protocol: TCP
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-budget-mcp
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-budget-mcp
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: aws-budget-mcp
                  key: AWS_DEFAULT_REGION
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8084"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aws-budget-mcp
  namespace: kagent
  labels:
    app.kubernetes.io/name: aws-budget-mcp
    app.kubernetes.io/part-of: aws-sandbox-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aws-budget-mcp
  ports:
    - name: mcp
      port: 8084
      targetPort: mcp
      protocol: TCP
