# Vault secret/platform/aws-budget → Secret/aws-budget-mcp.
# Keys in Vault: access_key_id, secret_access_key, region.
# Never commit the secret values.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aws-budget-mcp
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aws-budget-mcp
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: platform/aws-budget
        property: access_key_id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: platform/aws-budget
        property: secret_access_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: AWS_DEFAULT_REGION
      remoteRef:
        key: platform/aws-budget
        property: region
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
