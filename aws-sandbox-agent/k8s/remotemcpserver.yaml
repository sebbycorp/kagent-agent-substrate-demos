# Shape copied from kagent 0.10.0-rc2 helm/kagent/templates/toolserver-kagent.yaml
# plus protocol (CRD default STREAMABLE_HTTP; live kagent-tool-server is the same).
# Do not invent spec fields. Do not set spec.tls on an http:// URL.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: aws-budget-mcp
  namespace: kagent
  labels:
    app.kubernetes.io/name: aws-budget-mcp
    app.kubernetes.io/part-of: aws-sandbox-agent
spec:
  description: Read-mostly AWS budget and capacity tools for us-east-2
  protocol: STREAMABLE_HTTP
  timeout: 30s
  sseReadTimeout: 5m0s
  url: http://aws-budget-mcp.kagent:8084/mcp
