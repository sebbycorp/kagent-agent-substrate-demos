# GCP budget MCP tools Deployment + Service.
# Image: gcp-budget-mcp:dev (local tag for `ctr images import` on the k3s node).
# Intended published name: ghcr.io/sebbycorp/gcp-budget-mcp:dev
# imagePullPolicy: IfNotPresent — the pod cannot start until the image is
# imported on Viper. See images/gcp-budget-mcp/README.md.
#
# SA JSON is mounted as a file (GOOGLE_APPLICATION_CREDENTIALS) and also
# available as GOOGLE_CREDENTIALS. Never commit those values.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcp-budget-mcp
  namespace: kagent
  labels:
    app.kubernetes.io/name: gcp-budget-mcp
    app.kubernetes.io/part-of: gcp-sandbox-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gcp-budget-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gcp-budget-mcp
        app.kubernetes.io/part-of: gcp-sandbox-agent
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: gcp-budget-mcp
          image: gcp-budget-mcp:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: mcp
              containerPort: 8084
              protocol: TCP
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/gcp/credentials.json
            - name: GOOGLE_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: gcp-budget-mcp
                  key: credentials.json
            - name: GCP_BILLING_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: gcp-budget-mcp
                  key: GCP_BILLING_ACCOUNT
            - name: GCP_PROJECT
              valueFrom:
                secretKeyRef:
                  name: gcp-budget-mcp
                  key: GCP_PROJECT
            - name: GCP_REGION
              valueFrom:
                secretKeyRef:
                  name: gcp-budget-mcp
                  key: GCP_REGION
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8084"
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: gcp-sa
              mountPath: /var/secrets/gcp
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
        - name: gcp-sa
          secret:
            secretName: gcp-budget-mcp
            defaultMode: 0400
            items:
              - key: credentials.json
                path: credentials.json
---
apiVersion: v1
kind: Service
metadata:
  name: gcp-budget-mcp
  namespace: kagent
  labels:
    app.kubernetes.io/name: gcp-budget-mcp
    app.kubernetes.io/part-of: gcp-sandbox-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gcp-budget-mcp
  ports:
    - name: mcp
      port: 8084
      targetPort: mcp
      protocol: TCP
