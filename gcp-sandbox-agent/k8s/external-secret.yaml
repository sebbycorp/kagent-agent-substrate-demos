# Vault secret/platform/gcp-budget → Secret/gcp-budget-mcp.
# Keys in Vault: credentials_json, billing_account, project, region.
# Never commit the secret values. Billing account id may appear in docs:
# 011C38-867461-BE95B1
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gcp-budget-mcp
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gcp-budget-mcp
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: credentials.json
      remoteRef:
        key: platform/gcp-budget
        property: credentials_json
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: GCP_BILLING_ACCOUNT
      remoteRef:
        key: platform/gcp-budget
        property: billing_account
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: GCP_PROJECT
      remoteRef:
        key: platform/gcp-budget
        property: project
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: GCP_REGION
      remoteRef:
        key: platform/gcp-budget
        property: region
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
